name: apply-inbound-templates
on:
  workflow_dispatch:
  push:
    branches: [feat/native-vk-hash-generator]
    paths:
      - 'scripts/RUN_INBOUND_TEMPLATES'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/native-vk-hash-generator
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Decode FormModal and apply i18n
        run: |
          set -euo pipefail
          python3 scripts/decode_formodal_payload.py
          python3 scripts/apply_inbound_templates_i18n.py
          git config user.name "samur005"
          git config user.email "samur_005@mail.ru"
          git add frontend/src/pages/inbounds/form/InboundFormModal.tsx internal/web/translation/*.json
          git rm -f --ignore-unmatch scripts/RUN_INBOUND_TEMPLATES scripts/payloads/InboundFormModal.tsx.gz.b64 scripts/decode_formodal_payload.py scripts/patches/inbound-form-modal-templates.patch scripts/apply_inbound_templates_i18n.py .github/workflows/apply-inbound-templates.yml || true
          if git status --porcelain | grep -q .; then
            git commit -m "feat(inbounds): wire Templates presets + i18n keys"
            git push origin HEAD:feat/native-vk-hash-generator
          else
            echo "nothing to commit"
          fi
