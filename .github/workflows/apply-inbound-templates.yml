name: apply-inbound-templates
on:
  workflow_dispatch:
  push:
    branches: [feat/native-vk-hash-generator]
    paths:
      - 'scripts/RUN_INBOUND_TEMPLATES'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/native-vk-hash-generator
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply FormModal patch and i18n templates
        run: |
          set -euo pipefail
          patch -p1 < scripts/patches/inbound-form-modal-templates.patch
          python3 scripts/apply_inbound_templates_i18n.py
          git config user.name "samur005"
          git config user.email "samur_005@mail.ru"
          git add frontend/src/pages/inbounds/form/InboundFormModal.tsx internal/web/translation/*.json
          git rm -f --ignore-unmatch scripts/RUN_INBOUND_TEMPLATES || true
          if git status --porcelain | grep -q .; then
            git commit -m "$(cat <<'EOFMSG'
feat(inbounds): wire Templates presets + i18n keys

Apply FormModal Templates dropdown wiring and pages.inbounds.form.templates.*
keys across locales.
EOFMSG
)"
            git push origin HEAD:feat/native-vk-hash-generator
          else
            echo "nothing to commit"
          fi
