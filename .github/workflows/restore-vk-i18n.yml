name: restore-vk-i18n
on:
  workflow_dispatch:
  push:
    branches: [feat/native-vk-hash-generator]
    paths:
      - 'scripts/RUN_VK_I18N_RESTORE'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/native-vk-hash-generator
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore en-US and apply VK i18n
        run: |
          set -euo pipefail
          git checkout d407c5f -- internal/web/translation/en-US.json
          test -s internal/web/translation/ru-RU.json
          python3 scripts/apply_vk_i18n.py
          git config user.name "samur005"
          git config user.email "samur_005@mail.ru"
          git add internal/web/translation/en-US.json internal/web/translation/ru-RU.json frontend/src/pages/tunnels/QwdttVkPanel.tsx
          git rm -f --ignore-unmatch tmp-i18n-size-probe.txt build/en-US.json.gz.b64.a scripts/RUN_VK_I18N_RESTORE || true
          if git status --porcelain | grep -q .; then
            git commit -m "i18n(qwdtt): add en-US/ru-RU strings for native VK hash generator"
            git push origin HEAD:feat/native-vk-hash-generator
          else
            echo "nothing to commit"
          fi
